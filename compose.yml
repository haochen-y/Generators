services:
  n8n:
    stdin_open: true
    tty: true
    container_name: n8n
    image: n8nio/n8n:stable
    pull_policy: always
    ports:
      - "5678:5678"
    environment:
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - N8N_PORT=5678
      - N8N_SECURE_COOKIE=false
      - DOCKER_PULL=always
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: ollama
    pull_policy: always
    stdin_open: true
    tty: true
    ports:
      - "9000:9000"
    environment:
      OLLAMA_HOST: "0.0.0.0:9000"   # makes the server listen on 9000
      # OLLAMA_* model/context/log envs are not used by the official image
    volumes:
      - ollama_data:/root/.ollama   
    restart: unless-stopped
    # Optional: pre-pull a model on startup
    # command: /bin/sh -lc "ollama serve & sleep 2 && ollama pull gemma3:4b && wait -n"

volumes:
  n8n_data: {}
  ollama_data: {}
